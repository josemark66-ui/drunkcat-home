<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鈺潤生技 | 酒精精準度測試(地獄版)</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f4f8; margin: 0; padding: 10px; overflow: hidden; touch-action: none; user-select: none; }
        .brand { color: #2c3e50; font-weight: bold; font-size: 0.85rem; margin-top: 5px; }
        
        /* 縮小顯示區，確保內容不重疊 */
        #message { font-size: 0.95rem; font-weight: bold; height: 75px; color: #34495e; padding: 5px; margin-bottom: 5px; line-height: 1.4; }
        
        #game-stage {
            position: relative;
            width: 100%;
            height: calc(100vh - 210px); /* 最大化拉長距離 */
            border: 2px solid #ccc;
            background: #fff;
            border-radius: 10px;
        }

        #cat-player {
            width: 60px;
            height: 60px;
            background: #fff3e0;
            border: 2px solid #ff9f43;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            cursor: grab;
            position: absolute;
            z-index: 100;
            top: 10px;
            left: calc(50% - 30px);
        }

        /* 縮小目標框：增加難度 */
        .slot {
            width: 65px;
            height: 75px;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #7f8c8d;
        }
        .slot span { font-size: 24px; margin-bottom: 2px; }

        #target-zone {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 5px;
        }

        #startBtn {
            padding: 10px 30px;
            font-size: 0.9rem;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="brand">鈺潤生技 TRUVIV LAB</div>
    <div id="message">點擊「開始測試」挑戰！</div>
    
    <div id="game-stage">
        <div id="cat-player" style="display: none;">🐱</div>
        <div id="target-zone">
            <div class="slot" id="slot-rabbit"><span>🐰</span>Rabbit</div>
            <div class="slot" id="slot-cat"><span>🐱</span>Cat</div>
            <div class="slot" id="slot-pig"><span>🐷</span>Pig</div>
        </div>
    </div>

    <button id="startBtn" onclick="initGame()">開始測試</button>

    <script>
        const cat = document.getElementById('cat-player');
        const msg = document.getElementById('message');
        const startBtn = document.getElementById('startBtn');
        let startTime, isDragging = false;

        function initGame() {
            msg.innerHTML = "專注！貓咪即將現身...";
            startBtn.style.visibility = "hidden";
            cat.style.display = "none";
            cat.style.top = "10px";
            cat.style.left = "calc(50% - 30px)";
            
            setTimeout(() => {
                cat.style.display = "flex";
                msg.innerHTML = "👇 按住貓咪，精準滑入底部的 Cat 框！";
            }, Math.random() * 1000 + 1000);
        }

        cat.onpointerdown = function(e) {
            isDragging = true;
            startTime = Date.now();
            cat.setPointerCapture(e.pointerId);
            msg.innerHTML = "⏳ 計時中... 不要抖！";
        };

        cat.onpointermove = function(e) {
            if (!isDragging) return;
            const stage = document.getElementById('game-stage').getBoundingClientRect();
            let x = e.clientX - stage.left - 30;
            let y = e.clientY - stage.top - 30;
            
            // 限制不超出左右邊界
            if (x < 0) x = 0;
            if (x > stage.width - 60) x = stage.width - 60;

            cat.style.left = x + 'px';
            cat.style.top = y + 'px';
        };

        cat.onpointerup = function(e) {
            if (!isDragging) return;
            isDragging = false;
            cat.releasePointerCapture(e.pointerId);
            checkResult(e.clientX, e.clientY);
        };

        function checkResult(x, y) {
            const duration = Date.now() - startTime;
            const catRect = document.getElementById('slot-cat').getBoundingClientRect();
            const rabbitRect = document.getElementById('slot-rabbit').getBoundingClientRect();
            const pigRect = document.getElementById('slot-pig').getBoundingClientRect();

            if (isInside(x, y, catRect)) {
                showResult('cat', duration);
            } else if (isInside(x, y, rabbitRect)) {
                showResult('rabbit', duration);
            } else if (isInside(x, y, pigRect)) {
                showResult('pig', duration);
            } else {
                msg.innerHTML = "❌ 沒進框！<br>你的手比想像中還抖喔。";
                resetGame();
            }
        }

        function isInside(x, y, rect) {
            return x > rect.left && x < rect.right && y > rect.top && y < rect.bottom;
        }

        function showResult(type, time) {
            let res = `成績：${time}ms<br>`;
            if (type === 'cat') {
                if (time < 1000) res += "<span style='color:green'>✅ 神手！還可以多喝幾杯！</span>";
                else if (time < 1700) res += "<span style='color:orange'>🍺 微醉，喝口水可以再來。</span>";
                else if (time < 2000) res += "<span style='color:red'>😵 醉了！手腳反應明顯變慢。</span>";
                else res += "<span style='color:darkred'>😵 太慢了！你真的有醉。</span>";
            } else if (type === 'rabbit') {
                res += "<span style='color:red'>❌ 移到兔子！太醉了，<br>下次先吃「酒霸王牌」。</span>";
            } else if (type === 'pig') {
                res += "<span style='color:brown'>❌ 移到豬！你不是太醉，<br>就是年紀大，手腳不聽腦控制！</span>";
            }
            msg.innerHTML = res;
            resetGame();
        }

        function resetGame() {
            startBtn.style.visibility = "visible";
            startBtn.innerText = "再測一次";
        }
    </script>
</body>
</html>
